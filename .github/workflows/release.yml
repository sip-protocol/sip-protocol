name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: 'pnpm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        id: changesets
        # changesets/action v2 requires Changesets CLI v3; this repo pins
        # @changesets/cli ^2.31.0, so the v2 action hard-fails on every run
        # ("Changesets CLI v2 is not supported"). v1 is the documented
        # compatible pairing. Follow-up: migrate to CLI v3, then re-adopt v2.
        uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          # Org restricts GITHUB_TOKEN for PR creation; falls back if unset
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Sync changelog to docs
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "Packages published, triggering docs sync..."
          # Trigger the docs-sync workflow
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/sip-protocol/sip-protocol/dispatches \
            -d '{"event_type":"changelog-updated"}'
